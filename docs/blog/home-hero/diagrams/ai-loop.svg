<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a4030"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="#faf8f5"/>
  <text x="60" y="64" font-size="30" font-weight="700" fill="#1a1510">我（AI）这边的工作循环</text>
  <text x="60" y="98" font-size="17" fill="#6b6459">每一步都要留下"证据"，否则下一步只是把猜测再往前推一格</text>

  <!-- steps -->
  <g font-size="17">
    <rect x="60" y="150" width="200" height="86" rx="10" fill="#ffffff" stroke="#c9c2b6"/>
    <text x="160" y="186" font-size="19" font-weight="700" fill="#1a1510" text-anchor="middle">读懂现状</text>
    <text x="160" y="212" font-size="14" fill="#6b6459" text-anchor="middle">读代码 / 读交接文档</text>

    <rect x="290" y="150" width="200" height="86" rx="10" fill="#fdf6ee" stroke="#d9c3a8"/>
    <text x="390" y="186" font-size="19" font-weight="700" fill="#8a5a1f" text-anchor="middle">出方案 + 选项</text>
    <text x="390" y="212" font-size="14" fill="#6b6459" text-anchor="middle">带代价与推荐项</text>

    <rect x="520" y="150" width="200" height="86" rx="10" fill="#eef2f4" stroke="#a9bcc7"/>
    <text x="620" y="186" font-size="19" font-weight="700" fill="#1a1510" text-anchor="middle">你拍板</text>
    <text x="620" y="212" font-size="14" fill="#4a5f6b" text-anchor="middle">选择题，不是开放式提问</text>

    <rect x="750" y="150" width="200" height="86" rx="10" fill="#ffffff" stroke="#c9c2b6"/>
    <text x="850" y="186" font-size="19" font-weight="700" fill="#1a1510" text-anchor="middle">实现 + 自检</text>
    <text x="850" y="212" font-size="14" fill="#6b6459" text-anchor="middle">tsc / lint / build</text>

    <rect x="750" y="290" width="200" height="86" rx="10" fill="#eef2f4" stroke="#a9bcc7"/>
    <text x="850" y="326" font-size="19" font-weight="700" fill="#1a1510" text-anchor="middle">真浏览器验证</text>
    <text x="850" y="352" font-size="14" fill="#4a5f6b" text-anchor="middle">CDP + 像素差 + 帧率</text>

    <rect x="520" y="290" width="200" height="86" rx="10" fill="#ffffff" stroke="#c9c2b6"/>
    <text x="620" y="326" font-size="19" font-weight="700" fill="#1a1510" text-anchor="middle">写进文档</text>
    <text x="620" y="352" font-size="14" fill="#6b6459" text-anchor="middle">含踩过的坑与数字</text>

    <rect x="290" y="290" width="200" height="86" rx="10" fill="#ffffff" stroke="#c9c2b6"/>
    <text x="390" y="326" font-size="19" font-weight="700" fill="#1a1510" text-anchor="middle">提交并推送</text>
    <text x="390" y="352" font-size="14" fill="#6b6459" text-anchor="middle">可复制的总结</text>

    <rect x="60" y="290" width="200" height="86" rx="10" fill="#f6eeee" stroke="#d8bcbc"/>
    <text x="160" y="326" font-size="19" font-weight="700" fill="#9e2b25" text-anchor="middle">你验收</text>
    <text x="160" y="352" font-size="14" fill="#6b6459" text-anchor="middle">真机看一眼</text>
  </g>

  <!-- arrows -->
  <g stroke="#4a4030" stroke-width="2.2" fill="none" marker-end="url(#b)">
    <path d="M262 193 L288 193"/>
    <path d="M492 193 L518 193"/>
    <path d="M722 193 L748 193"/>
    <path d="M850 238 L850 288"/>
    <path d="M748 333 L722 333"/>
    <path d="M518 333 L492 333"/>
    <path d="M288 333 L262 333"/>
  </g>
  <!-- loop back -->
  <path d="M160 378 C 160 470, 300 470, 400 470 C 700 470, 900 460, 900 380" stroke="#9e2b25" stroke-width="2.2" fill="none" stroke-dasharray="8 6" marker-end="url(#b)"/>
  <text x="560" y="500" font-size="16" fill="#9e2b25" text-anchor="middle">验收不过 / 有新反馈 → 回到「出方案 + 选项」，不要自己改主意</text>

  <!-- evidence callouts -->
  <g>
    <rect x="60" y="520" width="1080" height="76" rx="10" fill="#ffffff" stroke="#c9c2b6"/>
    <text x="84" y="550" font-size="17" font-weight="700" fill="#1a1510">什么算证据</text>
    <text x="84" y="578" font-size="16" fill="#3d362c">截图（含连拍帧）、像素差百分比、rAF 帧间隔 p50/p95、PerformanceObserver 归因、断言脚本通过数、commit 号 —— 都不是"我觉得可以了"。</text>
  </g>
</svg>
